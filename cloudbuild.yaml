# Root-level Cloud Build config for STEP-D server
# Builds from repo root so Dockerfile can access monorepo package.json etc.
# Triggered by GitHub push (main branch) or manually via gcloud builds submit.
substitutions:
  _REGION: us-central1
  _SERVICE_NAME: stepd-server
  _GCS_BUCKET: stepd-media
  _CLOUD_SQL_INSTANCE: step-d:us-central1:stepd-db
  # 크레딧 단가(원). 비밀이 아니라 평문 env 다.
  # 임시값: 비용 약 ₩1,200/시간 × 1.4 ÷ 60분 = 크레딧당 ₩28 (실측 마진 보고 재결정)
  # ⚠️ 비우면 서버가 결제창을 아예 안 띄운다 — 0원 결제나 임의 단가보다 "안 됨"이 낫다.
  _CREDIT_PRICE_KRW: "28"
  # 로그인 강제. **`--set-env-vars` 는 전체를 갈아끼우므로** gcloud 로만 켜두면 다음 배포에
  # 초기화된다 — 여기 적어야 유지된다. 끄려면 "0" 으로 바꾸고 재배포(또는 즉시 gcloud update).
  _AUTH_REQUIRED: "1"

  # ⚠️ 포트원 채널키는 **두 개**다 (아래 --set-secrets 참조):
  #   PORTONE_CHANNEL_KEY          일반결제 — 결제창을 띄워 그 자리에서 긁는다
  #   PORTONE_BILLING_CHANNEL_KEY  빌링    — 카드 저장 + 저장 카드로 서버가 긁는다
  # 서로 다른 채널이라 한쪽 키로 다른 쪽을 하려 들면 실패한다. 하나로 합치지 말 것.
  # (주석을 --set-secrets 줄 사이에 넣으면 앞 줄의 `\` 가 이어받아 인자로 들어간다 —
  #  그래서 여기 적는다.)

  # ── 인보이스(거래명세서) 발행자 = 우리 ─────────────────────────────────────
  # 비밀이 아니다(사업자등록번호는 공개 정보). 평문 substitution 으로 둔다.
  # 비우면 문서에 '미설정'으로 찍힌다 — 없는 값을 지어내지 않는다.
  # 고객사(공급받는 자) 정보는 여기가 아니라 어드민 화면에서 회사마다 입력한다.
  _INVOICE_ISSUER_NAME: ""
  _INVOICE_ISSUER_BIZNO: ""
  _INVOICE_ISSUER_ADDRESS: ""
  _INVOICE_ISSUER_CONTACT: ""

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          -f apps/server/Dockerfile \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:$$(date +%s) \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:latest \
          .

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy $_SERVICE_NAME \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:latest \
          --region=$_REGION \
          --allow-unauthenticated \
          --cpu=2 \
          --memory=4Gi \
          --timeout=600 \
          --concurrency=10 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars=NODE_ENV=production,GCS_BUCKET=$_GCS_BUCKET,FACTORY_ENABLED=1,CREDIT_PRICE_KRW=$_CREDIT_PRICE_KRW,AUTH_REQUIRED=$_AUTH_REQUIRED,INVOICE_ISSUER_NAME=$_INVOICE_ISSUER_NAME,INVOICE_ISSUER_BIZNO=$_INVOICE_ISSUER_BIZNO,INVOICE_ISSUER_ADDRESS=$_INVOICE_ISSUER_ADDRESS,INVOICE_ISSUER_CONTACT=$_INVOICE_ISSUER_CONTACT \
          --set-secrets=DATABASE_URL=stepd-db-url:latest \
          --set-secrets=GOOGLE_CLIENT_ID=stepd-google-client-id:latest \
          --set-secrets=GOOGLE_CLIENT_SECRET=stepd-google-client-secret:latest \
          --set-secrets=JWT_SECRET=stepd-jwt-secret:latest \
          --set-secrets=PUBLIC_URL=stepd-public-url:latest \
          --set-secrets=LAB_WRITE_TOKEN=stepd-lab-write-token:latest \
          --set-secrets=FACTORY_API_KEY=stepd-factory-api-key:latest \
          --set-secrets=TIKTOK_CLIENT_KEY=stepd-tiktok-client-key:latest \
          --set-secrets=TIKTOK_CLIENT_SECRET=stepd-tiktok-client-secret:latest \
          --set-secrets=PORTONE_API_SECRET=stepd-portone-api-secret:latest \
          --set-secrets=PORTONE_STORE_ID=stepd-portone-store-id:latest \
          --set-secrets=PORTONE_CHANNEL_KEY=stepd-portone-channel-key:latest \
          --set-secrets=PORTONE_BILLING_CHANNEL_KEY=stepd-portone-billing-channel-key:latest \
          --set-secrets=PORTONE_WEBHOOK_SECRET=stepd-portone-webhook-secret:latest \
          --add-cloudsql-instances=$_CLOUD_SQL_INSTANCE \
          --service-account=stepd-deployer@$PROJECT_ID.iam.gserviceaccount.com

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s