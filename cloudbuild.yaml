# Root-level Cloud Build config for STEP-D server
# Builds from repo root so Dockerfile can access monorepo package.json etc.
# Triggered by GitHub push (main branch) or manually via gcloud builds submit.
substitutions:
  _REGION: us-central1
  _SERVICE_NAME: stepd-server
  _GCS_BUCKET: stepd-media
  _GCS_UPLOAD_BUCKET: stepd-upload-seoul
  _CLOUD_SQL_INSTANCE: step-d:us-central1:stepd-db
  # 크레딧 단가(원). 비밀이 아니라 평문 env 다.
  # 60 = 2026-08-25 인하(이력 28→150→60 · 세금 포함 · aena 결제창 표기와 정렬).
  # 원가 실측 ₩13.3/분(how-it-works §4) 대비 마진 ~78%.
  # ⚠️ 비우면 서버가 결제창을 아예 안 띄운다 — 0원 결제나 임의 단가보다 "안 됨"이 낫다.
  _CREDIT_PRICE_KRW: "60"
  # 로그인 강제. **`--set-env-vars` 는 전체를 갈아끼우므로** gcloud 로만 켜두면 다음 배포에
  # 초기화된다 — 여기 적어야 유지된다. 끄려면 "0" 으로 바꾸고 재배포(또는 즉시 gcloud update).
  _AUTH_REQUIRED: "1"

  # ⚠️ 포트원 채널키는 **두 개**다 (아래 --set-secrets 참조):
  #   PORTONE_CHANNEL_KEY          일반결제 — 결제창을 띄워 그 자리에서 긁는다
  #   PORTONE_BILLING_CHANNEL_KEY  빌링    — 카드 저장 + 저장 카드로 서버가 긁는다
  # 서로 다른 채널이라 한쪽 키로 다른 쪽을 하려 들면 실패한다. 하나로 합치지 말 것.
  # (주석을 --set-secrets 줄 사이에 넣으면 앞 줄의 `\` 가 이어받아 인자로 들어간다 —
  #  그래서 여기 적는다.)

  # ── 인보이스(거래명세서) 발행자 = 우리 ─────────────────────────────────────
  # 비밀이 아니다(사업자등록번호는 공개 정보). 평문 substitution 으로 둔다.
  # 비우면 문서에 '미설정'으로 찍힌다 — 없는 값을 지어내지 않는다.
  # 고객사(공급받는 자) 정보는 여기가 아니라 어드민 화면에서 회사마다 입력한다.
  _INVOICE_ISSUER_NAME: "하경진"
  # ⚠️ 아직 비어 있다. 사업자등록번호 없는 명세서는 상대가 회계 처리에 쓸 수 없다 —
  # 지금은 화면 확인용이고, 실제로 회사에 보내기 전에 반드시 채울 것.
  _INVOICE_ISSUER_BIZNO: ""
  _INVOICE_ISSUER_ADDRESS: ""
  _INVOICE_ISSUER_CONTACT: ""

  # ── 메일 발송 계정 (인보이스 · 자동배포 알림 — mailer.ts) ──────────────────
  # 인증은 Gmail XOAUTH2 — 비밀 3종은 --set-secrets 의 SMTP_OAUTH_* 참조.
  # ⚠️ 워커 알림은 stepd-worker-youtube **Job** env 가 따로다(jobs update --update-secrets
  # 로 이미 연결 · 2026-08-24). cloud.sh worker 는 이미지 태그만 갱신하므로 안 지워진다.
  _SMTP_USER: "hkj@stepai.kr"

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          -f apps/server/Dockerfile \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:$$(date +%s) \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:latest \
          .

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy $_SERVICE_NAME \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:latest \
          --region=$_REGION \
          --allow-unauthenticated \
          --cpu=2 \
          --memory=4Gi \
          --timeout=600 \
          --concurrency=10 \
          --min-instances=1 \
          --cpu-boost \
          --max-instances=5 \
          --set-env-vars=NODE_ENV=production,GCS_BUCKET=$_GCS_BUCKET,GCS_UPLOAD_BUCKET=$_GCS_UPLOAD_BUCKET,FACTORY_ENABLED=1,CREDIT_PRICE_KRW=$_CREDIT_PRICE_KRW,AUTH_REQUIRED=$_AUTH_REQUIRED,NAVER_UPLOAD_ENABLED=1,YOUTUBE_UPLOAD_ENABLED=1,TIKTOK_UPLOAD_ENABLED=1,TIKTOK_DIRECT_POST=1,INSTAGRAM_UPLOAD_ENABLED=1,FACEBOOK_UPLOAD_ENABLED=1,INVOICE_ISSUER_NAME=$_INVOICE_ISSUER_NAME,INVOICE_ISSUER_BIZNO=$_INVOICE_ISSUER_BIZNO,INVOICE_ISSUER_ADDRESS=$_INVOICE_ISSUER_ADDRESS,INVOICE_ISSUER_CONTACT=$_INVOICE_ISSUER_CONTACT,SMTP_USER=$_SMTP_USER \
          --set-secrets=DATABASE_URL=stepd-db-url:latest \
          --set-secrets=GOOGLE_CLIENT_ID=stepd-google-client-id:latest \
          --set-secrets=GOOGLE_CLIENT_SECRET=stepd-google-client-secret:latest \
          --set-secrets=JWT_SECRET=stepd-jwt-secret:latest \
          --set-secrets=PUBLIC_URL=stepd-public-url:latest \
          --set-secrets=INTERNAL_API_TOKEN=stepd-factory-api-key:latest \
          --set-secrets=TIKTOK_CLIENT_KEY=stepd-tiktok-client-key:latest \
          --set-secrets=TIKTOK_CLIENT_SECRET=stepd-tiktok-client-secret:latest \
          --set-secrets=META_APP_ID=stepd-meta-app-id:latest \
          --set-secrets=META_APP_SECRET=stepd-meta-app-secret:latest \
          --set-secrets=INSTAGRAM_APP_ID=stepd-instagram-app-id:latest \
          --set-secrets=INSTAGRAM_APP_SECRET=stepd-instagram-app-secret:latest \
          --set-secrets=PORTONE_API_SECRET=stepd-portone-api-secret:latest \
          --set-secrets=PORTONE_STORE_ID=stepd-portone-store-id:latest \
          --set-secrets=PORTONE_CHANNEL_KEY=stepd-portone-channel-key:latest \
          --set-secrets=PORTONE_BILLING_CHANNEL_KEY=stepd-portone-billing-channel-key:latest \
          --set-secrets=PORTONE_WEBHOOK_SECRET=stepd-portone-webhook-secret:latest \
          --set-secrets=NAVER_SESSION_KEY=stepd-naver-session-key:latest \
          --set-secrets=SMTP_OAUTH_CLIENT_ID=stepd-smtp-oauth-client-id:latest \
          --set-secrets=SMTP_OAUTH_CLIENT_SECRET=stepd-smtp-oauth-client-secret:latest \
          --set-secrets=SMTP_OAUTH_REFRESH_TOKEN=stepd-smtp-oauth-refresh-token:latest \
          --add-cloudsql-instances=$_CLOUD_SQL_INSTANCE \
          --service-account=stepd-deployer@$PROJECT_ID.iam.gserviceaccount.com

  # ── 렌더 전용 서비스 stepd-render ─────────────────────────────────────────────
  # 같은 이미지·같은 env/secrets 로 두 번째 Cloud Run 서비스를 띄운다. 차이는 **동시성=1**
  # (렌더 하나당 인스턴스 하나 → 동시 렌더가 서로 CPU 를 안 뺏음 · 서버리스로 인스턴스가 렌더
  # 수만큼 자동 팬아웃) + 4vCPU/8Gi(무거운 ffmpeg 인코딩) + timeout 900s(긴 클립). min=0 이라
  # 렌더 돌 때만 과금. 웹의 /api/render-proxy 가 clips/:id/export 만 여기로 보낸다(index 서버는
  # 안 건드림). env 를 서버와 동일하게 둬 같은 이미지가 동일하게 뜨는 걸 보장한다.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy stepd-render \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/stepd-server/stepd-server:latest \
          --region=$_REGION \
          --allow-unauthenticated \
          --cpu=4 \
          --memory=8Gi \
          --timeout=900 \
          --concurrency=1 \
          --min-instances=0 \
          --cpu-boost \
          --max-instances=5 \
          --set-env-vars=NODE_ENV=production,GCS_BUCKET=$_GCS_BUCKET,GCS_UPLOAD_BUCKET=$_GCS_UPLOAD_BUCKET,FACTORY_ENABLED=1,CREDIT_PRICE_KRW=$_CREDIT_PRICE_KRW,AUTH_REQUIRED=$_AUTH_REQUIRED,NAVER_UPLOAD_ENABLED=1,YOUTUBE_UPLOAD_ENABLED=1,TIKTOK_UPLOAD_ENABLED=1,TIKTOK_DIRECT_POST=1,INSTAGRAM_UPLOAD_ENABLED=1,FACEBOOK_UPLOAD_ENABLED=1,INVOICE_ISSUER_NAME=$_INVOICE_ISSUER_NAME,INVOICE_ISSUER_BIZNO=$_INVOICE_ISSUER_BIZNO,INVOICE_ISSUER_ADDRESS=$_INVOICE_ISSUER_ADDRESS,INVOICE_ISSUER_CONTACT=$_INVOICE_ISSUER_CONTACT,SMTP_USER=$_SMTP_USER \
          --set-secrets=DATABASE_URL=stepd-db-url:latest \
          --set-secrets=GOOGLE_CLIENT_ID=stepd-google-client-id:latest \
          --set-secrets=GOOGLE_CLIENT_SECRET=stepd-google-client-secret:latest \
          --set-secrets=JWT_SECRET=stepd-jwt-secret:latest \
          --set-secrets=PUBLIC_URL=stepd-public-url:latest \
          --set-secrets=INTERNAL_API_TOKEN=stepd-factory-api-key:latest \
          --set-secrets=TIKTOK_CLIENT_KEY=stepd-tiktok-client-key:latest \
          --set-secrets=TIKTOK_CLIENT_SECRET=stepd-tiktok-client-secret:latest \
          --set-secrets=META_APP_ID=stepd-meta-app-id:latest \
          --set-secrets=META_APP_SECRET=stepd-meta-app-secret:latest \
          --set-secrets=INSTAGRAM_APP_ID=stepd-instagram-app-id:latest \
          --set-secrets=INSTAGRAM_APP_SECRET=stepd-instagram-app-secret:latest \
          --set-secrets=PORTONE_API_SECRET=stepd-portone-api-secret:latest \
          --set-secrets=PORTONE_STORE_ID=stepd-portone-store-id:latest \
          --set-secrets=PORTONE_CHANNEL_KEY=stepd-portone-channel-key:latest \
          --set-secrets=PORTONE_BILLING_CHANNEL_KEY=stepd-portone-billing-channel-key:latest \
          --set-secrets=PORTONE_WEBHOOK_SECRET=stepd-portone-webhook-secret:latest \
          --set-secrets=NAVER_SESSION_KEY=stepd-naver-session-key:latest \
          --set-secrets=SMTP_OAUTH_CLIENT_ID=stepd-smtp-oauth-client-id:latest \
          --set-secrets=SMTP_OAUTH_CLIENT_SECRET=stepd-smtp-oauth-client-secret:latest \
          --set-secrets=SMTP_OAUTH_REFRESH_TOKEN=stepd-smtp-oauth-refresh-token:latest \
          --add-cloudsql-instances=$_CLOUD_SQL_INSTANCE \
          --service-account=stepd-deployer@$PROJECT_ID.iam.gserviceaccount.com

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
