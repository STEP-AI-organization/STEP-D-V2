<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>STEP-D · 썸네일 템플릿 디자이너</title>
<style>
  :root {
    --bg: #0f1116; --panel: #1a1d26; --border: #2a2f3a;
    --text: #e8e9ee; --muted: #8b8f9c;
    --person: rgba(46, 213, 115, 0.28); --person-b: #2ed573;
    --main: rgba(255, 71, 87, 0.28);     --main-b: #ff4757;
    --subtitle: rgba(255, 165, 2, 0.28); --subtitle-b: #ffa502;
    --quote: rgba(83, 82, 237, 0.28);    --quote-b: #5352ed;
    --badge: rgba(255, 107, 156, 0.28);  --badge-b: #ff6b9c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 13px; }
  .layout { display: grid; grid-template-columns: 220px 1fr 340px; gap: 14px; max-width: 1800px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .panel + .panel { margin-top: 10px; }
  .panel h2 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .canvas-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .canvas-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; color: var(--muted); }
  .canvas {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #2a2f3a url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect fill="%23333" width="60" height="60"/><path stroke="%23444" stroke-width="1" d="M0 30h60M30 0v60"/></svg>');
    border: 2px solid #444; border-radius: 6px; overflow: hidden; user-select: none;
  }
  .grid-overlay { position: absolute; inset: 0; pointer-events: none; }
  .grid-overlay div {
    position: absolute; border: 1px dashed rgba(255,255,255,0.10);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.15); font-size: 9px;
  }
  .zone {
    position: absolute; border: 2px solid; border-radius: 3px;
    cursor: move; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }
  .zone.selected { outline: 2px dashed white; outline-offset: 2px; z-index: 100; }
  .zone.overlay-mode { opacity: 0.55; }
  .zone .lbl { pointer-events: none; padding: 2px 5px; background: rgba(0,0,0,0.55); border-radius: 2px; font-size: 10px; }
  .zone .resize {
    position: absolute; right: 0; bottom: 0; width: 12px; height: 12px;
    background: white; cursor: nwse-resize; border-radius: 2px;
  }
  .zone.person   { background: var(--person);   border-color: var(--person-b); }
  .zone.main     { background: var(--main);     border-color: var(--main-b); }
  .zone.subtitle { background: var(--subtitle); border-color: var(--subtitle-b); }
  .zone.quote    { background: var(--quote);    border-color: var(--quote-b); }
  .zone.badge    { background: var(--badge);    border-color: var(--badge-b); }

  select, input, button { background: #262a35; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; font-size: 12px; font-family: inherit; }
  button { cursor: pointer; }
  button:hover { background: #313641; }
  button.primary { background: #5352ed; border-color: #5352ed; }
  button.danger { background: #ff4757; border-color: #ff4757; }
  button.small { padding: 3px 6px; font-size: 11px; }
  .row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
  input[type="text"] { width: 100%; }
  label { display: block; margin: 6px 0 3px; font-size: 11px; color: var(--muted); }

  .tpl-list { display: flex; flex-direction: column; gap: 4px; max-height: 350px; overflow-y: auto; }
  .tpl-item { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: #262a35; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .tpl-item:hover { background: #313641; }
  .tpl-item.active { background: #5352ed; }
  .tpl-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tpl-item button { padding: 2px 6px; font-size: 10px; }

  .zone-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .zone-row { display: flex; align-items: center; gap: 5px; padding: 5px; background: #262a35; border-radius: 5px; font-size: 11px; }
  .zone-row .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .zone-row .id { flex: 1; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zone-row .coord { color: var(--muted); font-family: monospace; font-size: 9px; }
  .zone-row button { padding: 2px 6px; font-size: 10px; }

  textarea { width: 100%; height: 200px; background: #0a0c11; color: #b8f5b8;
    border: 1px solid var(--border); border-radius: 5px; padding: 8px;
    font-family: "SF Mono", Consolas, monospace; font-size: 10px; resize: vertical; }

  .toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .toolbar label { margin: 0; display: flex; align-items: center; gap: 4px; }
  .toolbar input[type="checkbox"] { margin: 0; }
</style>
</head>
<body>

<h1>썸네일 템플릿 디자이너 · 컬렉션 모드</h1>
<p class="hint">
  좌측 = 템플릿 목록 · 중앙 = 편집 캔버스 · 우측 = 존 관리·Export.
  여러 템플릿 만들어 Export All 로 한 번에 전달.
</p>

<div class="layout">
  <!-- ─── 좌측 · 템플릿 컬렉션 ─── -->
  <div>
    <div class="panel">
      <h2>템플릿 컬렉션</h2>
      <div class="row">
        <button id="btnNew" class="primary">+ 새 템플릿</button>
        <button id="btnDup" class="small">복제</button>
        <button id="btnDelTpl" class="small danger">삭제</button>
      </div>
      <div id="tplList" class="tpl-list"></div>
    </div>
    <div class="panel">
      <h2>프리셋 (참고)</h2>
      <select id="preset" style="width:100%; margin-bottom:6px;">
        <option value="T1">T1 · 1인 클로즈업</option>
        <option value="T2">T2 · 2인 대립</option>
        <option value="T3">T3 · 명대사</option>
        <option value="T4">T4 · 리액션·반전</option>
      </select>
      <button id="btnAddPreset" class="small" style="width:100%;">이 프리셋 컬렉션에 추가</button>
    </div>
    <div class="panel">
      <h2>Import (JSON 붙여넣기)</h2>
      <textarea id="importIn" placeholder="JSON 배열 or 단일 template" style="height:80px; font-size:10px;"></textarea>
      <div class="row" style="margin-top:6px;">
        <button id="btnImport" class="small">가져오기</button>
      </div>
    </div>
  </div>

  <!-- ─── 중앙 · 캔버스 ─── -->
  <div>
    <div class="canvas-wrap">
      <div class="toolbar">
        <label><input type="checkbox" id="chkOverlay"> 다른 템플릿 오버레이 표시</label>
        <span style="flex:1;"></span>
        <span id="canvasSize" style="font-family:monospace; color:var(--muted); font-size:11px;">-- × --</span>
      </div>
      <div id="canvas" class="canvas">
        <div class="grid-overlay" id="grid"></div>
      </div>
    </div>
  </div>

  <!-- ─── 우측 · 편집 패널 ─── -->
  <div>
    <div class="panel">
      <h2>현재 템플릿</h2>
      <label>id</label>
      <input id="tplId" type="text" placeholder="T5_custom">
      <label>설명</label>
      <input id="tplDesc" type="text" placeholder="예: 클로즈업+대형 배지">
    </div>
    <div class="panel">
      <h2>존 추가</h2>
      <div class="row">
        <select id="zoneType">
          <option value="person">person</option>
          <option value="main">main</option>
          <option value="subtitle">subtitle</option>
          <option value="quote">quote</option>
          <option value="badge">badge</option>
        </select>
        <input id="zoneId" type="text" placeholder="id" style="width:110px;">
        <button id="btnAddZone" class="primary small">추가</button>
      </div>
    </div>
    <div class="panel">
      <h2>존 목록</h2>
      <div id="zoneList" class="zone-list"></div>
    </div>
    <div class="panel">
      <h2>Export</h2>
      <div class="row">
        <button id="btnExportOne" class="small">현재만</button>
        <button id="btnExportAll" class="primary small">Export All (전체 배열)</button>
        <button id="btnCopy" class="small">복사</button>
      </div>
      <textarea id="exportOut" placeholder="Export 클릭"></textarea>
    </div>
  </div>
</div>

<script>
// ─── 상수 ───────────────────────────────────────
const CANVAS = document.getElementById("canvas");
const GRID = document.getElementById("grid");
const ZONE_LIST = document.getElementById("zoneList");
const TPL_LIST = document.getElementById("tplList");
const EXPORT_OUT = document.getElementById("exportOut");
const CHK_OVERLAY = document.getElementById("chkOverlay");
const STORAGE_KEY = "stepd_tpl_collection_v1";

// 프리셋 (초기 참고)
const PRESETS = {
  T1: { id: "T1_closeup", desc: "1인 클로즈업",
    zones: [
      { type:"person",   id:"hero",     x:0.55, y:0.20, w:0.42, h:0.78 },
      { type:"subtitle", id:"cap_sub",  x:0.03, y:0.40, w:0.45, h:0.10 },
      { type:"main",     id:"cap_main", x:0.03, y:0.72, w:0.55, h:0.20 },
    ]},
  T2: { id: "T2_split", desc: "2인 대립",
    zones: [
      { type:"person", id:"left",     x:0.02, y:0.40, w:0.40, h:0.58 },
      { type:"person", id:"right",    x:0.58, y:0.40, w:0.40, h:0.58 },
      { type:"main",   id:"cap_main", x:0.15, y:0.03, w:0.70, h:0.18 },
    ]},
  T3: { id: "T3_quote", desc: "명대사",
    zones: [
      { type:"person",   id:"hero",      x:0.60, y:0.40, w:0.35, h:0.58 },
      { type:"quote",    id:"cap_quote", x:0.03, y:0.35, w:0.55, h:0.25 },
      { type:"subtitle", id:"cap_sub",   x:0.03, y:0.85, w:0.35, h:0.10 },
    ]},
  T4: { id: "T4_reaction", desc: "리액션·반전",
    zones: [
      { type:"person", id:"reactor",   x:0.05, y:0.42, w:0.36, h:0.55 },
      { type:"person", id:"cause",     x:0.72, y:0.03, w:0.25, h:0.42 },
      { type:"badge",  id:"cap_badge", x:0.03, y:0.03, w:0.28, h:0.09 },
      { type:"main",   id:"cap_main",  x:0.50, y:0.80, w:0.48, h:0.15 },
    ]},
};

// ─── 상태 ───────────────────────────────────────
let COLLECTION = [];    // [{id, desc, zones:[{type,id,x,y,w,h}]}]
let ACTIVE = null;      // 현재 편집 중인 template obj
let SELECTED_ZONE = null;

// ─── localStorage 저장/로드 ─────────────────────
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(COLLECTION));
}
function load() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) COLLECTION = JSON.parse(s);
  } catch (e) { COLLECTION = []; }
  // 비어있으면 4개 프리셋으로 시작
  if (!COLLECTION.length) {
    for (const k of Object.keys(PRESETS)) {
      const p = PRESETS[k];
      COLLECTION.push({ id: p.id, desc: p.desc, zones: p.zones.map(z => ({...z})) });
    }
    save();
  }
  ACTIVE = COLLECTION[0];
}

// ─── 격자 ─────────────────────────────────────
function drawGrid() {
  GRID.innerHTML = "";
  const rows = [[0,0.33],[0.33,0.67],[0.67,1.00]];
  const cols = [[0,0.33],[0.33,0.67],[0.67,1.00]];
  const names = [["TL","TC","TR"],["ML","MC","MR"],["BL","BC","BR"]];
  rows.forEach(([y0,y1], i) => cols.forEach(([x0,x1], j) => {
    const d = document.createElement("div");
    d.style.left = (x0*100)+"%"; d.style.top = (y0*100)+"%";
    d.style.width = ((x1-x0)*100)+"%"; d.style.height = ((y1-y0)*100)+"%";
    d.textContent = names[i][j];
    GRID.appendChild(d);
  }));
}
function updateCanvasSize() {
  const r = CANVAS.getBoundingClientRect();
  document.getElementById("canvasSize").textContent = `${Math.round(r.width)} × ${Math.round(r.height)}`;
}
window.addEventListener("resize", updateCanvasSize);

// ─── 캔버스 렌더링 ─────────────────────────────
function renderCanvas() {
  // 기존 zone element 제거
  CANVAS.querySelectorAll(".zone").forEach(z => z.remove());
  if (!ACTIVE) return;
  // 오버레이 모드면 다른 template 반투명 렌더
  if (CHK_OVERLAY.checked) {
    COLLECTION.forEach(tpl => {
      if (tpl === ACTIVE) return;
      tpl.zones.forEach(z => {
        const el = createZoneEl(z, tpl.id, true);
        CANVAS.appendChild(el);
      });
    });
  }
  // 활성 template 렌더 (인터랙션 가능)
  ACTIVE.zones.forEach(z => {
    const el = createZoneEl(z, ACTIVE.id, false);
    CANVAS.appendChild(el);
    bindInteraction(el, z);
  });
  updateZoneList();
}

function createZoneEl(spec, tplId, isOverlay) {
  const el = document.createElement("div");
  el.className = "zone " + spec.type + (isOverlay ? " overlay-mode" : "");
  el.dataset.id = spec.id;
  el.dataset.tpl = tplId;
  const lbl = document.createElement("div");
  lbl.className = "lbl";
  lbl.textContent = isOverlay ? `${tplId}:${spec.id}` : `${spec.id}·${spec.type}`;
  el.appendChild(lbl);
  if (!isOverlay) {
    const r = document.createElement("div");
    r.className = "resize"; r.dataset.role = "resize";
    el.appendChild(r);
  }
  positionZone(el, spec);
  return el;
}

function positionZone(el, s) {
  el.style.left = (s.x*100)+"%";
  el.style.top = (s.y*100)+"%";
  el.style.width = (s.w*100)+"%";
  el.style.height = (s.h*100)+"%";
}

function bindInteraction(el, spec) {
  el.addEventListener("mousedown", (e) => {
    if (e.target.dataset.role === "resize") return startResize(e, el, spec);
    startDrag(e, el, spec);
    selectZone(spec);
  });
}

function startDrag(e, el, spec) {
  const r = CANVAS.getBoundingClientRect();
  const start = { mx: e.clientX, my: e.clientY, sx: spec.x, sy: spec.y, W: r.width, H: r.height };
  e.preventDefault();
  const move = (ev) => {
    const dx = (ev.clientX - start.mx) / start.W;
    const dy = (ev.clientY - start.my) / start.H;
    spec.x = Math.max(0, Math.min(1 - spec.w, start.sx + dx));
    spec.y = Math.max(0, Math.min(1 - spec.h, start.sy + dy));
    positionZone(el, spec); updateZoneList();
  };
  const up = () => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    save();
  };
  window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
}

function startResize(e, el, spec) {
  e.stopPropagation();
  const r = CANVAS.getBoundingClientRect();
  const startR = { mx: e.clientX, my: e.clientY, sw: spec.w, sh: spec.h, W: r.width, H: r.height };
  const move = (ev) => {
    const dw = (ev.clientX - startR.mx) / startR.W;
    const dh = (ev.clientY - startR.my) / startR.H;
    spec.w = Math.max(0.05, Math.min(1 - spec.x, startR.sw + dw));
    spec.h = Math.max(0.05, Math.min(1 - spec.y, startR.sh + dh));
    positionZone(el, spec); updateZoneList();
  };
  const up = () => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    save();
  };
  window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
}

function selectZone(spec) {
  SELECTED_ZONE = spec;
  CANVAS.querySelectorAll(".zone").forEach(z =>
    z.classList.toggle("selected", z.dataset.id === spec.id && !z.classList.contains("overlay-mode")));
}

function updateZoneList() {
  ZONE_LIST.innerHTML = "";
  if (!ACTIVE) return;
  ACTIVE.zones.forEach(spec => {
    const row = document.createElement("div");
    row.className = "zone-row";
    const sw = document.createElement("div");
    sw.className = "swatch";
    sw.style.background = getComputedStyle(document.documentElement).getPropertyValue("--"+spec.type+"-b");
    row.appendChild(sw);
    const id = document.createElement("div");
    id.className = "id"; id.textContent = `${spec.id}·${spec.type}`;
    row.appendChild(id);
    const c = document.createElement("div");
    c.className = "coord"; c.textContent = `${spec.x.toFixed(2)},${spec.y.toFixed(2)}·${spec.w.toFixed(2)}×${spec.h.toFixed(2)}`;
    row.appendChild(c);
    const b = document.createElement("button"); b.textContent = "×";
    b.onclick = () => { ACTIVE.zones = ACTIVE.zones.filter(z => z !== spec); save(); renderCanvas(); };
    row.appendChild(b);
    ZONE_LIST.appendChild(row);
  });
}

// ─── 템플릿 목록 ────────────────────────────
function updateTplList() {
  TPL_LIST.innerHTML = "";
  COLLECTION.forEach(tpl => {
    const item = document.createElement("div");
    item.className = "tpl-item" + (tpl === ACTIVE ? " active" : "");
    const nm = document.createElement("div");
    nm.className = "nm"; nm.textContent = `${tpl.id} · (${tpl.zones.length})`;
    item.appendChild(nm);
    item.onclick = () => { ACTIVE = tpl; refreshAll(); };
    TPL_LIST.appendChild(item);
  });
  document.getElementById("tplId").value = ACTIVE ? ACTIVE.id : "";
  document.getElementById("tplDesc").value = ACTIVE ? (ACTIVE.desc || "") : "";
}

function refreshAll() {
  updateTplList();
  renderCanvas();
}

// ─── 이벤트 ────────────────────────────────
document.getElementById("btnNew").onclick = () => {
  const tpl = { id: `T${COLLECTION.length + 1}_new`, desc: "", zones: [] };
  COLLECTION.push(tpl); ACTIVE = tpl; save(); refreshAll();
};
document.getElementById("btnDup").onclick = () => {
  if (!ACTIVE) return;
  const dup = JSON.parse(JSON.stringify(ACTIVE));
  dup.id = ACTIVE.id + "_copy";
  COLLECTION.push(dup); ACTIVE = dup; save(); refreshAll();
};
document.getElementById("btnDelTpl").onclick = () => {
  if (!ACTIVE || !confirm(`"${ACTIVE.id}" 삭제?`)) return;
  COLLECTION = COLLECTION.filter(t => t !== ACTIVE);
  ACTIVE = COLLECTION[0] || null; save(); refreshAll();
};
document.getElementById("btnAddPreset").onclick = () => {
  const key = document.getElementById("preset").value;
  const p = PRESETS[key];
  const tpl = { id: p.id + "_custom", desc: p.desc, zones: p.zones.map(z => ({...z})) };
  COLLECTION.push(tpl); ACTIVE = tpl; save(); refreshAll();
};
document.getElementById("btnAddZone").onclick = () => {
  if (!ACTIVE) return;
  const t = document.getElementById("zoneType").value;
  const id = document.getElementById("zoneId").value.trim();
  if (!id) { alert("id 입력"); return; }
  if (ACTIVE.zones.some(z => z.id === id)) { alert("id 중복"); return; }
  ACTIVE.zones.push({ type: t, id, x: 0.30, y: 0.30, w: 0.35, h: 0.30 });
  document.getElementById("zoneId").value = "";
  save(); renderCanvas();
};
document.getElementById("tplId").addEventListener("input", (e) => {
  if (ACTIVE) { ACTIVE.id = e.target.value.trim(); save(); updateTplList(); }
});
document.getElementById("tplDesc").addEventListener("input", (e) => {
  if (ACTIVE) { ACTIVE.desc = e.target.value.trim(); save(); }
});
CHK_OVERLAY.addEventListener("change", renderCanvas);

// ─── Export ───────────────────────────────────
function tplToExport(tpl) {
  return {
    id: tpl.id,
    description: tpl.desc || "",
    person_zones: tpl.zones.filter(z => z.type === "person").map((z, i) => ({
      id: z.id, xywh: [r3(z.x), r3(z.y), r3(z.w), r3(z.h)], z_index: i,
    })),
    caption_zones: tpl.zones.filter(z => z.type !== "person").map(z => ({
      id: z.id, role: z.type, xywh: [r3(z.x), r3(z.y), r3(z.w), r3(z.h)],
    })),
    background: { mode: "source_blur", blur: "medium",
      nano_hint: "원본 프레임 blur · 인물 없이 배경 톤만" },
  };
}
function r3(v) { return Math.round(v * 1000) / 1000; }

document.getElementById("btnExportOne").onclick = () => {
  if (!ACTIVE) return;
  EXPORT_OUT.value = JSON.stringify(tplToExport(ACTIVE), null, 2);
};
document.getElementById("btnExportAll").onclick = () => {
  EXPORT_OUT.value = JSON.stringify(COLLECTION.map(tplToExport), null, 2);
};
document.getElementById("btnCopy").onclick = () => {
  if (!EXPORT_OUT.value) document.getElementById("btnExportAll").click();
  EXPORT_OUT.select(); document.execCommand("copy");
  alert("복사됨 · Claude 에 붙여넣기");
};
document.getElementById("btnImport").onclick = () => {
  const t = document.getElementById("importIn").value.trim();
  if (!t) return;
  try {
    const parsed = JSON.parse(t);
    const arr = Array.isArray(parsed) ? parsed : [parsed];
    arr.forEach(item => {
      const zones = [
        ...(item.person_zones || []).map(z => ({
          type: "person", id: z.id,
          x: z.xywh?.[0] ?? 0.3, y: z.xywh?.[1] ?? 0.3,
          w: z.xywh?.[2] ?? 0.3, h: z.xywh?.[3] ?? 0.3,
        })),
        ...(item.caption_zones || []).map(z => ({
          type: z.role || "main", id: z.id,
          x: z.xywh?.[0] ?? 0.3, y: z.xywh?.[1] ?? 0.3,
          w: z.xywh?.[2] ?? 0.3, h: z.xywh?.[3] ?? 0.3,
        })),
      ];
      COLLECTION.push({ id: item.id, desc: item.description || "", zones });
    });
    save(); refreshAll();
    alert(`${arr.length}개 가져옴`);
  } catch (e) { alert("JSON 파싱 실패 · " + e.message); }
};

// ─── 초기화 ──────────────────────────────────
drawGrid();
updateCanvasSize();
load();
refreshAll();
</script>
</body>
</html>
