# CI — main 으로 들어오는 모든 변경을 여기서 막는다.
#
# 2026-09-07 신설. 그전엔 CI 가 없어서 "사람이 pnpm check 를 돌린다" 는 규율에 의존했다.
# 혼자일 땐 됐지만 사람이 늘면 안 지켜진다 — 그리고 안 지켜진 걸 아무도 모른다.
#
# ## 무엇을 넣고 무엇을 뺐나
#
# **넣은 것은 지금 초록인 것뿐이다.** 빨간 관문은 사람이 무시하게 되고(CLAUDE.md 원칙),
# 그러면 관문 전체가 무의미해진다. 그래서 `pnpm lint`(웹 eslint)는 **일부러 뺐다** —
# 기존 오류가 30개 남아 있다. 0 으로 만든 뒤에 이 파일에 추가할 것.
#
# 도는 것: 전 패키지 typecheck · 서버 테스트(1671) · 네이티브 테스트 · core 파이썬(103) · 웹 빌드
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR 에 연달아 푸시하면 앞 실행을 취소한다 — 어차피 최신 커밋만 의미가 있다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입체크 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # core 테스트는 순수 함수만 본다(Vertex·GCS 안 탄다) — requirements-dev 만 깔면 된다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r core/requirements-dev.txt

      - run: pnpm install --frozen-lockfile

      # 로컬 `pnpm check` 와 **같은 명령**이다. 갈라지면 "내 컴에선 되는데" 가 시작된다.
      # 다만 core 는 --required 로 올려 CI 에서 조용히 건너뛰지 못하게 한다.
      #
      # ⚠️ `--fail-if-no-match` 를 빼지 말 것. pnpm 은 필터가 아무 패키지와도 안 맞으면
      # "No projects matched the filters" 를 찍고 **exit 0** 으로 끝난다 — 관문이 빨개지는 게
      # 아니라 **조용히 초록**이 된다. 2026-09-07~09-11 나흘간 여기 `@stepd/native` 라고
      # 적혀 있었고(실제 이름은 `stepaistudio`) 네이티브 테스트가 한 번도 안 돌았다.
      # 이름 오타의 실패 방향을 "안 돌았는데 통과" 에서 "빨강" 으로 뒤집는 게 이 플래그다.
      - name: 전 패키지 typecheck
        run: pnpm -r typecheck
      - name: 서버 테스트
        run: pnpm --filter @stepd/server --fail-if-no-match test
      - name: 네이티브 테스트
        run: pnpm --filter stepaistudio --fail-if-no-match test
      - name: core 파이썬 테스트
        run: node scripts/test-core.mjs --required

  web-build:
    name: 웹 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `tsc --noEmit` 만으로는 부족하다 — 프리렌더가 여기서 걸린다(apps/web/CLAUDE.md).
      # useSearchParams 를 Suspense 로 안 감싼 페이지 같은 건 빌드에서만 드러난다.
      # 빌드타임에 서버를 부르지 않으므로 실제 API 주소는 필요 없다.
      - name: next build
        run: pnpm --filter @stepd/web --fail-if-no-match build
        env:
          NEXT_PUBLIC_API_URL: /api/proxy/api

  # ── e2e — 진짜 Postgres 에 진짜 서버를 띄우고 HTTP 로 묻는다 ────────────────────
  #
  # 왜 넣었나: 서버 테스트 1671개가 **전부** 순수 함수이거나 소스 스캔이라, DB 를 켜고
  # 라우트를 타는 검증이 하나도 없었다. 그 공백이 실제로 사고를 냈다 —
  #   "2026-08-11 에 API 키 3단계를 이렇게 배선해서 프로덕션에서 통째로 안 도는 상태로
  #    나갔다(순수·소스 테스트만 있어서 전부 통과했다)"  — rls-access.test.ts 주석
  #
  # 테넌트 격리는 **DB 안에서만** 증명된다. 정책이 `current_setting('app.tenant_id')` 를 읽고
  # 그게 안 세워지면 에러가 아니라 **빈 결과**가 나오기 때문이다(실패가 조용하다).
  #
  # 여기서 CI 가 하는 일은 **Postgres 를 하나 띄우는 것뿐**이다. DB·역할 생성, 마이그레이션,
  # 서버 기동, 정리는 전부 `scripts/e2e.mts` 안에 있다 — 로컬에서 `pnpm test:e2e` 한 줄로
  # 같은 것이 돌아야 "내 컴에선 되는데" 가 안 생긴다.
  e2e:
    name: e2e (Postgres + 진짜 서버)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # ⚠️ 그냥 `postgres:16` 이면 안 된다 — 마이그레이션 0009 가 `CREATE EXTENSION vector`
        # 를 요구한다(검색 임베딩 768d). 프로덕션 Cloud SQL 에는 pgvector 가 깔려 있다.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: e2e (인증 · 워크스페이스 격리)
        run: pnpm test:e2e
        env:
          # 관리자 접속 — 스크립트가 이걸로 **격리 전용 역할**(NOSUPERUSER·NOBYPASSRLS)과
          # 빈 DB 를 만든다. 서버는 절대 이 계정으로 붙지 않는다. 그 이유는 e2e.mts 주석 참조:
          # superuser 로 붙으면 RLS 정책이 통째로 무시돼 격리 테스트가 **거짓 통과**한다.
          E2E_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
