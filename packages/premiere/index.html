<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* Premiere 패널은 어두운 UI 다 — 그 안에서 튀지 않게 호스트 색을 따른다.
       ⚠️ **UXP 는 브라우저가 아니다.** 컨테이너의 기본 배치가 달라서(브라우저의 block 처럼
       세로로 쌓이지 않는다) 라벨과 입력칸이 가로로 붙어 버렸다(2026-08-28 실측).
       그래서 여기서는 **쌓아야 하는 것마다 flex-column 을 명시**하고, 높이도 값으로 준다 —
       브라우저 기본값에 기대는 CSS 는 UXP 에서 그대로 무너진다. */
    body {
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      font-family: "Adobe Clean", -apple-system, "Malgun Gothic", sans-serif;
      font-size: 13px;
      color: #e8e8e8;
      background: #262626;
    }
    /* 패널을 넓게 벌려도 입력칸이 화면 끝까지 늘어나지 않게 — 폼은 읽기 좋은 폭에서 멈춘다. */
    #loginView, #uploadView { display: flex; flex-direction: column; max-width: 460px; }
    h3 { margin: 0 0 16px 0; font-size: 15px; font-weight: 600; }
    .row { display: flex; flex-direction: column; margin-bottom: 14px; }
    .label { color: #a0a0a0; font-size: 12px; margin-bottom: 6px; }
    input, select {
      width: 100%;
      height: 32px;
      box-sizing: border-box;
      padding: 0 10px;
      background: #1d1d1d; color: #e8e8e8; border: 1px solid #4a4a4a; border-radius: 3px;
      font-size: 13px;
    }
    button {
      width: 100%;
      height: 36px;
      margin-top: 6px;
      background-color: #2680eb; color: #ffffff; border: none; border-radius: 3px;
      font-size: 13px; font-weight: 600;
    }
    button:disabled { background-color: #3a3a3a; color: #808080; }
    button.secondary {
      background-color: transparent; border: 1px solid #5a5a5a; color: #cccccc; font-weight: 400;
    }
    .file {
      padding: 18px 10px;
      border: 1px dashed #5a5a5a; border-radius: 3px;
      text-align: center; color: #999999; font-size: 12px; word-break: break-all;
    }
    .file.picked { border-style: solid; border-color: #2680eb; color: #e8e8e8; }
    /* 무엇이 렌더될지 — 딸깍 전에 눈으로 확인하는 자리. 누르면 다시 읽는다. */
    .seq {
      padding: 10px;
      background: #1d1d1d; border: 1px solid #4a4a4a; border-radius: 3px;
      color: #999999; font-size: 12px; word-break: break-all;
    }
    .seq.ready { color: #e8e8e8; border-color: #2680eb; }
    .divider {
      margin: 20px 0 12px 0;
      color: #6e6e6e; font-size: 11px; text-align: center;
    }
    .tabs { display: flex; flex-direction: row; margin-bottom: 16px; }
    .tab {
      width: 50%; height: 30px; margin-top: 0;
      background-color: transparent; color: #999999; font-weight: 400;
      border-bottom: 2px solid #3a3a3a; border-radius: 0;
    }
    .tab.active { color: #ffffff; font-weight: 600; border-bottom: 2px solid #2680eb; }
    #uploadPane, #recsPane { display: flex; flex-direction: column; }
    .recs { display: flex; flex-direction: column; }
    /* 추천 한 줄 — 누르면 그 구간으로 플레이헤드가 간다. */
    .rec {
      display: flex; flex-direction: column;
      padding: 10px; margin-bottom: 8px;
      background: #1d1d1d; border: 1px solid #3a3a3a; border-left: 3px solid #2680eb;
      border-radius: 3px;
    }
    .rec-title { color: #e8e8e8; font-size: 12px; margin-bottom: 4px; }
    .rec-meta { color: #8a8a8a; font-size: 11px; }
    .bar { height: 4px; background: #1d1d1d; border-radius: 2px; overflow: hidden; margin-top: 8px; }
    .bar > div { height: 4px; width: 0%; background-color: #2680eb; }
    .status { font-size: 12px; color: #a0a0a0; margin-top: 12px; line-height: 1.5; word-break: break-all; }
    .status.err { color: #ec5b62; }
    .status.ok { color: #33ab84; }
    .hidden { display: none; }
    .muted { color: #777777; font-size: 12px; margin-top: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <!-- ① 로그인 — STEP-D 계정. 세션은 패널에만 남고 프로젝트/디스크에 저장하지 않는다. -->
  <div id="loginView">
    <h3>STEP AI 스튜디오</h3>
    <div class="row">
      <div class="label">이메일</div>
      <input id="email" type="text" autocomplete="off" />
    </div>
    <div class="row">
      <div class="label">비밀번호</div>
      <input id="password" type="password" />
    </div>
    <button id="loginBtn">로그인</button>
    <div id="loginStatus" class="status"></div>
    <div class="muted">stepd.stepai.kr 과 같은 계정입니다.</div>
  </div>

  <!-- ② 로그인 후 본 화면 — 프로그램은 두 탭이 함께 쓴다. -->
  <div id="uploadView" class="hidden">
    <div class="row">
      <div class="label">프로그램</div>
      <select id="program"></select>
    </div>

    <div class="tabs">
      <button id="tabUpload" class="tab active">업로드</button>
      <button id="tabRecs" class="tab">추천 구간</button>
    </div>

    <!-- ②-A 업로드 — 프리미어에서 렌더한 완성본을 STEP-D 로 바로 올린다. -->
    <div id="uploadPane">
      <!-- 주 동선 — 편집이 끝났으면 내보내기 대신 이 버튼 하나. -->
      <div class="row">
        <div class="label">지금 편집 중인 시퀀스</div>
        <div id="seqBox" class="seq">확인 중…</div>
      </div>
      <button id="exportBtn" disabled>렌더해서 업로드</button>

      <div class="divider">또는 이미 렌더한 파일</div>

      <!-- 폴백 — 다른 도구로 만든 완성본, 이미 뽑아 둔 파일. -->
      <div class="row">
        <div id="fileBox" class="file">렌더한 MP4 를 선택하세요</div>
        <button id="pickBtn" class="secondary">파일 선택</button>
      </div>
      <button id="uploadBtn" class="secondary" disabled>파일 업로드</button>
      <div class="bar"><div id="progress"></div></div>
      <div id="status" class="status"></div>
    </div>

    <!-- ②-B 추천 구간 — 서버가 만든 추천을 프리미어 안에서 보고, 눌러서 그 구간으로 간다. -->
    <div id="recsPane" class="hidden">
      <div id="recsList" class="recs"></div>
      <div id="recsStatus" class="status"></div>
      <!-- 한 번에 꽂고, 되돌릴 때도 Ctrl+Z 한 번 (트랜잭션 하나에 담는다). -->
      <button id="markersBtn" disabled>타임라인에 마커로 꽂기</button>
      <button id="recsReload" class="secondary">목록 새로고침</button>
    </div>

    <button id="logoutBtn" class="secondary" style="margin-top:16px;">로그아웃</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
